services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guilherme-portfolio
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
